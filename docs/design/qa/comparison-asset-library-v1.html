<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asset Library V1 — Source and Integration</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #071b30;
        color: #f2ede2;
        font-family: Arial, sans-serif;
      }
      main {
        width: 2000px;
        min-height: 1450px;
        padding: 52px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 32px;
      }
      h1 {
        margin: 0;
        font:
          58px/1.05 Georgia,
          serif;
      }
      header p {
        margin: 0;
        max-width: 660px;
        font: 16px/1.45 monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .grid {
        display: grid;
        grid-template-columns: 720px 1fr;
        gap: 28px;
      }
      .panel {
        border: 1px solid rgba(242, 237, 226, 0.35);
        background: #11130f;
        padding: 24px;
      }
      .panel h2 {
        margin: 0 0 18px;
        font: 14px/1.2 monospace;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .sources {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      figure {
        margin: 0;
        background: #f2ede2;
        border: 1px solid rgba(242, 237, 226, 0.25);
        overflow: hidden;
      }
      figure.dark {
        background: #11130f;
      }
      figure img {
        display: block;
        width: 100%;
        height: 255px;
        object-fit: contain;
      }
      figure.landscape img {
        object-fit: cover;
      }
      figcaption {
        padding: 10px 12px;
        background: #071b30;
        color: #f2ede2;
        font: 12px/1.3 monospace;
        letter-spacing: 0.05em;
      }
      .implementation {
        display: grid;
        gap: 18px;
      }
      .implementation img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid rgba(242, 237, 226, 0.25);
      }
      .implementation .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .implementation .row img {
        height: 390px;
        object-fit: cover;
        object-position: top;
      }
      .implementation .row img:first-child {
        background: #f2ede2;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Branded Asset Library / V1</h1>
        <p>
          Generated source assets at left. Production browser integration at
          right. Modern editorial shell plus old-future image language.
        </p>
      </header>
      <div class="grid">
        <section class="panel">
          <h2>Generated source system</h2>
          <div class="sources">
            <figure class="landscape">
              <img
                src="../../../public/assets/brand/landscapes/field-station-dawn-01.png"
                alt=""
              />
              <figcaption>L01 / FIELD STATION</figcaption>
            </figure>
            <figure class="landscape">
              <img
                src="../../../public/assets/brand/landscapes/satellite-grove-01.png"
                alt=""
              />
              <figcaption>L02 / SATELLITE GROVE</figcaption>
            </figure>
            <figure>
              <img
                src="../../../public/assets/brand/symbols/fresh-citrus-disc-01.png"
                alt=""
              />
              <figcaption>S01 / CITRUS DISC</figcaption>
            </figure>
            <figure>
              <img
                src="../../../public/assets/brand/symbols/fresh-citrus-slice-01.png"
                alt=""
              />
              <figcaption>S02 / CITRUS SLICE</figcaption>
            </figure>
            <figure class="dark">
              <img
                src="../../../public/assets/brand/diagrams/orbital-citrus-system-01.png"
                alt=""
              />
              <figcaption>D01 / ORBITAL CITRUS</figcaption>
            </figure>
            <figure>
              <img
                src="../../../public/assets/brand/editorial-framing/calibration-corner-01.png"
                alt=""
              />
              <figcaption>F01 / CALIBRATION CORNER</figcaption>
            </figure>
          </div>
        </section>
        <section class="panel implementation">
          <h2>Live editorial integration</h2>
          <img src="asset-library-v1-work-component-final.png" alt="" />
          <img src="asset-library-v1-current-component.png" alt="" />
          <div class="row">
            <img src="asset-library-v1-footer-component.png" alt="" />
            <img src="asset-library-v1-mobile.png" alt="" />
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
