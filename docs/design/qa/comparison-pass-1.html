<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Design QA comparison — pass 1</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #11130f;
        color: #f2ede2;
        font-family: sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
      }
      figure {
        margin: 0;
        min-width: 0;
        background: #11130f;
      }
      figcaption {
        padding: 10px 14px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source visual truth</figcaption>
        <img
          src="../references/approved-direction.png"
          alt="Approved design direction"
        />
      </figure>
      <figure>
        <figcaption>Rendered implementation — pass 1</figcaption>
        <img
          src="implementation-desktop-pass-1.png"
          alt="Rendered implementation screenshot"
        />
      </figure>
    </main>
  </body>
</html>
