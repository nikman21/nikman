<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="file:///Users/nikolasmanuel/nikman/docs/design/qa/" />
    <title>All Pages — Personal Symbol System QA</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #071b30;
        color: #f2ede2;
        font-family: Arial, sans-serif;
      }

      main {
        width: 2000px;
        padding: 48px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 28px;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font:
          54px/1 Georgia,
          serif;
      }

      header p {
        max-width: 650px;
        margin: 0;
        font: 15px/1.45 monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .panel {
        border: 1px solid rgb(242 237 226 / 35%);
        background: #11130f;
        padding: 22px;
      }

      .panel-title {
        margin: 0 0 16px;
        font: 13px/1.2 monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .sources {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid rgb(242 237 226 / 22%);
        background: #f2ede2;
      }

      .sources img {
        display: block;
        width: 100%;
        height: 165px;
        object-fit: contain;
      }

      figcaption {
        background: #071b30;
        padding: 9px 11px;
        color: #f2ede2;
        font: 11px/1.3 monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .routes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }

      .routes img {
        display: block;
        width: 100%;
        height: 680px;
        object-fit: cover;
        object-position: top;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Personal Field Marks / All-Page Rollout</h1>
        <p>
          Source symbols above. Browser-rendered route families below. Every
          human-facing page receives one semantic mark and one restrained visual
          artifact.
        </p>
      </header>

      <section class="panel">
        <p class="panel-title">Generated source language</p>
        <div class="sources">
          <figure>
            <img
              src="../../../public/assets/brand/personal-symbols/personal-orange-01.png"
              alt=""
            />
            <figcaption>P01 / Orange / About + Fresh</figcaption>
          </figure>
          <figure>
            <img
              src="../../../public/assets/brand/personal-symbols/personal-king-01.png"
              alt=""
            />
            <figcaption>P02 / King / Work</figcaption>
          </figure>
          <figure>
            <img
              src="../../../public/assets/brand/personal-symbols/personal-fish-01.png"
              alt=""
            />
            <figcaption>P03 / Fish / Notes</figcaption>
          </figure>
          <figure>
            <img
              src="../../../public/assets/brand/personal-symbols/personal-cross-01.png"
              alt=""
            />
            <figcaption>P04 / Cross / Principles</figcaption>
          </figure>
          <figure>
            <img
              src="../../../public/assets/brand/personal-symbols/personal-compass-01.png"
              alt=""
            />
            <figcaption>P05 / Compass / Current + 404</figcaption>
          </figure>
        </div>

        <p class="panel-title">Browser-rendered route coverage</p>
        <div class="routes">
          <figure>
            <img src="all-pages-work-desktop.png" alt="" />
            <figcaption>Work / King + calibration</figcaption>
          </figure>
          <figure>
            <img src="all-pages-work-detail-desktop.png" alt="" />
            <figcaption>Work detail / King + field plate</figcaption>
          </figure>
          <figure>
            <img src="all-pages-notes-desktop.png" alt="" />
            <figcaption>Notes / Fish + field stamp</figcaption>
          </figure>
          <figure>
            <img src="all-pages-note-detail-desktop.png" alt="" />
            <figcaption>Note detail / Fish + topographic</figcaption>
          </figure>
          <figure>
            <img src="all-pages-principles-desktop.png" alt="" />
            <figcaption>Principles / Cross + topographic</figcaption>
          </figure>
          <figure>
            <img src="all-pages-current-desktop.png" alt="" />
            <figcaption>Current / Compass + orbital</figcaption>
          </figure>
          <figure>
            <img src="all-pages-about-desktop.png" alt="" />
            <figcaption>About / Orange + onward marks</figcaption>
          </figure>
          <figure>
            <img src="all-pages-404-desktop.png" alt="" />
            <figcaption>404 / Compass + calibration</figcaption>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
