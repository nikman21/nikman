<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background continuity comparison</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #111;
        color: #f2ede2;
        font:
          600 12px/1.3 ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      section {
        display: grid;
        gap: 14px;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin-bottom: 8px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #454545;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <figure>
          <figcaption>Before / top fallback bar</figcaption>
          <img
            src="background-continuity-before-top.png"
            alt="Before state at the page top"
          />
        </figure>
        <figure>
          <figcaption>Before / bottom fallback bar</figcaption>
          <img
            src="background-continuity-before-bottom.png"
            alt="Before state near the page bottom"
          />
        </figure>
      </section>
      <section>
        <figure>
          <figcaption>After / continuous top canvas</figcaption>
          <img
            src="background-continuity-after-top.png"
            alt="Fixed state at the page top"
          />
        </figure>
        <figure>
          <figcaption>After / continuous bottom canvas</figcaption>
          <img
            src="background-continuity-after-bottom.png"
            alt="Fixed state at the page bottom"
          />
        </figure>
      </section>
    </main>
  </body>
</html>
