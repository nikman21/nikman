<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro-space background refinement comparison</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #111;
        color: #f2ede2;
        font:
          600 13px/1.3 ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin-bottom: 10px;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #454545;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Before / higher-contrast environment</figcaption>
        <img
          src="implementation-retro-space-final.png"
          alt="Previous implementation with a larger brighter planet and denser star field"
        />
      </figure>
      <figure>
        <figcaption>After / quieter framing environment</figcaption>
        <img
          src="implementation-retro-space-quiet-desktop.png"
          alt="Revised implementation with a smaller muted planet and calmer dark star field"
        />
      </figure>
    </main>
  </body>
</html>
